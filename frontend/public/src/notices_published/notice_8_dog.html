<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Georgia', serif;
            line-height: 1.6;
            color: #2c3e50;
            background: #ecf0f1;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-left: 5px solid #e74c3c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .header {
            background: #34495e;
            color: white;
            padding: 30px;
            border-bottom: 3px solid #e74c3c;
        }
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        .header .subtitle {
            font-size: 1em;
            opacity: 0.8;
            font-style: italic;
        }
        .content {
            padding: 35px 30px;
        }
        .paragraph {
            margin: 25px 0;
            font-size: 1.15em;
            text-align: justify;
            line-height: 1.9;
        }
        .footer {
            background: #34495e;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .date-info {
            font-size: 0.9em;
        }
        .status-badge {
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85em;
            text-transform: uppercase;
        }
        .status-badge.published {
            background: #27ae60;
            color: white;
        }
        .media-section {
            margin: 30px 0;
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .links-section {
            margin-top: 40px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .links-section h3 {
            margin-bottom: 20px;
            color: #34495e;
            font-size: 1.3em;
            border-bottom: 2px solid #e74c3c;
            padding-bottom: 10px;
        }
        .links-list {
            list-style: none;
        }
        .links-list li {
            margin: 15px 0;
            padding-left: 25px;
            position: relative;
        }
        .links-list li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #e74c3c;
            font-weight: bold;
        }
        .links-list a {
            color: #e74c3c;
            text-decoration: none;
            font-size: 1.05em;
        }
        .links-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DOG</h1>
            
        </div>
        <div class="content">
            
            
            
            
            
            
            
            <div class="links-section">
                <h3>Attachments & Resources</h3>
                <ul class="links-list">
                    
                </ul>
            </div>
            
        </div>
        <div class="footer">
            <div class="date-info">
                <div><strong>Valid From:</strong> November 1, 2025</div>
                <div><strong>Valid Until:</strong> November 2, 2025</div>
            </div>
            <div class="status-badge published">published</div>
        </div>
    </div>
</body>
</html>
