<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST Staff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .content {
            padding: 40px 30px;
        }
        .meta {
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            font-size: 0.9em;
            color: #666;
        }
        .date-range {
            display: flex;
            gap: 20px;
        }
        .status {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85em;
        }
        .status.published {
            background: #d4edda;
            color: #155724;
        }
        .paragraph {
            margin: 20px 0;
            font-size: 1.1em;
            line-height: 1.8;
        }
        .links-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e9ecef;
        }
        .links-section h3 {
            margin-bottom: 15px;
            color: #667eea;
        }
        .links-list {
            list-style: none;
        }
        .links-list li {
            margin: 10px 0;
        }
        .links-list a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 15px;
            background: #f0f4ff;
            border-radius: 6px;
            display: inline-block;
            transition: all 0.3s;
        }
        .links-list a:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TEST Staff</h1>
            
            <div class="subtitle">kasjda</div>
            
        </div>
        <div class="content">
            
            <div class="paragraph">xx xx x xxoasijd oasd </div>
            
            
            
            
            
            
            
            <div class="links-section">
                <h3>Related Links</h3>
                <ul class="links-list">
                    
                </ul>
            </div>
            
        </div>
        <div class="meta">
            <div class="date-range">
                <div><strong>Start:</strong> November 3, 2025</div>
                <div><strong>End:</strong> November 6, 2025</div>
            </div>
            <div class="status published">published</div>
        </div>
    </div>
</body>
</html>
